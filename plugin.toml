#:schema .build/jpt/configs/plugin.schema.json
schema = 1

[plugin]
id = "lyricbridge"
name = "LyricBridge"
guid = "70a9d327-7e98-4201-88a5-724d39366c40"
assembly = "Jellyfin.Plugin.LyricBridge"
repository = "rakuzen25/jellyfin-plugin-lyricbridge"
owner = "rakuzen25"
description = "Follow your music with synchronized karaoke lyrics in Jellyfin Web.\n      Search multiple lyric providers, import lyrics, and save your preferred versions. Display\n      translations and pronunciation alongside the original lyrics, with optional tools to generate\n      missing language support or transcribe audio."
overview = "Word-by-word karaoke lyrics, translations, and pronunciation for Jellyfin\n      Web."
category = "Music"

[host]
abi = "12.2.0.0"
framework = "net10.0"
platform = "linux/amd64"
image = "jellyfin/jellyfin@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037"

[backend]
entry = "src/Host/LyricBridge.csproj"
project_assemblies = ["LyricBridge.Core", "LyricBridge.Infrastructure"]
tests = [
  "tests/backend/Core/LyricBridge.Core.Tests.csproj",
  "tests/backend/Infrastructure/LyricBridge.Infrastructure.Tests.csproj",
  "tests/backend/Host/LyricBridge.Host.Tests.csproj",
]
source_roots = ["src", "tests/backend"]
unmanaged_projects = ["Lyricify.Lyrics.Helper"]

[backend.projects]
Core = "src/Core/LyricBridge.Core.csproj"
Infrastructure = "src/Infrastructure/LyricBridge.Infrastructure.csproj"
Host = "src/Host/LyricBridge.csproj"

[validation]
renovate_tests = "tests/tooling/renovate-policy.mjs"
groups = [
  "metadata",
  "frontend",
  "backend",
  "tooling",
  "workflow",
  "rendering",
  "performance",
  "artifacts",
]
check_targets = ["frontend", "backend", "tooling", "automation", "docs"]
unit_groups = ["frontend", "backend", "tooling"]
acceptance_groups = [
  "workflow",
  "rendering",
  "performance",
  "installation",
  "reproducibility",
]


[validation.job_names]
rendering = [
  "rendering (chromium)",
  "rendering (mobile-chromium)",
  "rendering (firefox)",
  "rendering (webkit)",
]
performance = [
  "performance (stress-chromium)",
  "performance (stress-mobile-chromium)",
]

[validation.browser_inputs.performance]
files = [
  "tests/browser/performance/**",
  "tests/browser/fixtures/**",
  "tests/browser/playwright.config.cjs",
  "tests/browser/groups.json",
  "tests/browser/package.json",
]
assets = [
  "demo.html",
  "lyricbridge.js",
  "lyricbridge.css",
  "jellyfin-lyric-motion.js",
  "jellyfin-lyric-motion.css",
]
projects = ["stress-chromium", "stress-mobile-chromium"]
workers = 1
runner = "ubuntu-24.04"

[images]
playwright = "mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea"

[architecture.edges]
"src/Core/LyricBridge.Core.csproj" = []
"src/Infrastructure/LyricBridge.Infrastructure.csproj" = [
  "src/Core/LyricBridge.Core.csproj",
  "vendor/Lyricify.Lyrics.Helper/Lyricify.Lyrics.Helper.csproj",
]
"src/Host/LyricBridge.csproj" = [
  "src/Core/LyricBridge.Core.csproj",
  "src/Infrastructure/LyricBridge.Infrastructure.csproj",
  "vendor/Lyricify.Lyrics.Helper/Lyricify.Lyrics.Helper.csproj",
]
"tests/backend/Core/LyricBridge.Core.Tests.csproj" = [
  "src/Core/LyricBridge.Core.csproj",
]
"tests/backend/Infrastructure/LyricBridge.Infrastructure.Tests.csproj" = [
  "src/Infrastructure/LyricBridge.Infrastructure.csproj",
]
"tests/backend/Host/LyricBridge.Host.Tests.csproj" = [
  "src/Host/LyricBridge.csproj",
]

[architecture.forbidden]
"src/Core" = [
  "Microsoft.Data.Sqlite",
  "MediaBrowser.",
  "Jellyfin.",
  "System.Net.Http",
  "Plugin.Instance",
]
"src/Infrastructure" = ["MediaBrowser.", "Jellyfin.", "Plugin.Instance"]

[frontend]
enabled = true
directory = "frontend"
admin_entry = "admin/config.ts"
admin_template = "frontend/admin/config.html"
boundary_check = "frontend/check-boundaries.mjs"
script_marker = "<!-- LYRICBRIDGE_CONFIG_SCRIPT -->"
version_symbol = "__LYRICBRIDGE_VERSION__"
extra_assets = [
  { source = "NOTICE", name = "NOTICE.txt" },
  { source = "vendor/LUCIDE-LICENSE", name = "LUCIDE-LICENSE.txt" },
]
required_assets = [
  "config.html",
  "lyricbridge.css",
  "jellyfin-lyric-motion.css",
  "lyricbridge.js",
  "jellyfin-lyric-motion.js",
]
reload_assets = [
  "lyricbridge.css",
  "jellyfin-lyric-motion.css",
  "lyricbridge.js",
  "jellyfin-lyric-motion.js",
]

[frontend.entries]
"bridge.ts" = "lyricbridge.js"
"renderer.ts" = "jellyfin-lyric-motion.js"

[frontend.banners]
"renderer.ts" = "/* Generated from maintained TypeScript sources. Renderer-derived files retain MPL-2.0; matching editable source accompanies this distribution. */"

[browser]
directory = "tests/browser"
groups = "tests/browser/groups.json"

[sandbox]
asset_prefix = "/LyricBridge/assets/"
settings_page = "lyricbridge"

[source]
roots = ["src", "docs", "frontend", "vendor", "scripts", "tests", ".github"]

[distribution]
web = true
notices = [
  { source = "vendor/DOTNET-LICENSE" },
  { source = "vendor/DYNAMIC-BACKGROUND-LICENSE" },
  { source = "vendor/KAWARP-LICENSE" },
  { source = "vendor/KAWAZU-LICENSE" },
  { source = "vendor/LIBNMECAB-LGPL-LICENSE" },
  { source = "vendor/LIBNMECAB-LICENSE" },
  { source = "vendor/LUCIDE-LICENSE" },
  { source = "vendor/LYRICIFY-LICENSE" },
  { source = "vendor/LYRICMOTION-LICENSE" },
  { source = "vendor/NEWTONSOFT-LICENSE" },
  { source = "vendor/OPENCC-DATA-LICENSE" },
  { source = "vendor/OPENCC-LICENSE" },
  { source = "vendor/QMC-LICENSE" },
  { source = "vendor/SHARPZIPLIB-LICENSE" },
  { source = "vendor/ZSTDSHARP-LICENSE" },
  { source = "vendor/LIBNMECAB-SOURCE.tar.gz" },
  { source = "vendor/DOTNET-THIRD-PARTY-NOTICES" },
  { source = "vendor/LYRICMOTION-THIRD-PARTY-NOTICES.md" },
  { source = "vendor/OPENCC-THIRD-PARTY-NOTICES.md" },
  { source = "LICENSE" },
  { source = "NOTICE" },
  { source = "GPL-3.0.txt" },
]
web_notices = [
  { source = "vendor/LYRICMOTION-LICENSE", name = "LICENSE" },
  { source = "vendor/DYNAMIC-BACKGROUND-LICENSE", name = "DYNAMIC-BACKGROUND-LICENSE.txt" },
  { source = "vendor/LYRICMOTION-THIRD-PARTY-NOTICES.md", name = "THIRD_PARTY_NOTICES.md" },
  { source = "vendor/KAWARP-LICENSE", name = "KAWARP-LICENSE.txt" },
  { source = "vendor/QMC-LICENSE", name = "QMC-LICENSE.txt" },
]
payload_notices = [
  { source = "KawazuDictionary/COPYING", name = "IPADIC-COPYING" },
]
web_exclude = ["demo.html", "demo.wav"]

