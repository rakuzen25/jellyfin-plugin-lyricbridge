[operations.check-frontend]
after = [
  [
    "{pnpm}",
    "exec",
    "knip",
  ],
  [
    "node",
    "frontend/check-boundaries.mjs",
  ],
  [
    "{pnpm}",
    "--dir",
    "frontend",
    "exec",
    "tsc",
    "--project",
    "tsconfig.tests.json",
    "--noEmit",
  ],
]

[operations.test-frontend]
after = [
  [
    "node",
    "--test",
    "tests/tooling/renderer-contract.test.mjs",
    "tests/tooling/typescript-toolchain.test.mjs",
  ],
]

[operations.check-tooling]
after = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "internal",
    "architecture",
  ],
]

[operations.test-tooling]
commands = [["{python}", "-m", "scripts.tooling_tests"]]

[operations.test-installation]
commands = [
  [
    "{python}",
    "-m",
    "tests.installation.web_installation",
  ],
  [
    "{python}",
    "-m",
    "tests.installation.package_installation",
  ],
]

[operations.test-workflow]
commands = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "test",
    "browser",
    "--",
    "--project",
    "workflow-chromium",
    "--workers=2",
  ],
]

[operations.test-rendering]
commands = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "test",
    "browser",
    "--",
    "--project",
    "chromium",
    "--project",
    "mobile-chromium",
    "--project",
    "firefox",
    "--project",
    "webkit",
    "--workers=2",
  ],
]

[operations.test-performance]
commands = [
  [
    "{python}",
    "-m",
    "jellyfin_plugin_toolkit",
    "test",
    "browser",
    "--",
    "--project",
    "stress-chromium",
    "--project",
    "stress-mobile-chromium",
    "--workers=2",
  ],
]

[advisories]
waivers = []
