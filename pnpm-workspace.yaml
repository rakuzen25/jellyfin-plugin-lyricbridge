packages:
  - frontend
  - browser-tests

# The compatibility wrapper otherwise resolves a floating TypeScript 6 compiler.
overrides:
  "@typescript/old": "npm:typescript@6.0.3"

# esbuild needs its platform-specific binary installation; other dependency
# lifecycle scripts are not authorized implicitly.
allowBuilds:
  esbuild: true
strictDepBuilds: true
pmOnFail: error
# Restoration is explicit and frozen in CI/packaging; checks must not install.
verifyDepsBeforeRun: false
# Keep the 24-hour policy aligned with Renovate and pip (test:tooling checks it).
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@typescript-eslint/eslint-plugin@8.71.2"
  - "@typescript-eslint/parser@8.71.2"
  - "@typescript-eslint/project-service@8.71.2"
  - "@typescript-eslint/scope-manager@8.71.2"
  - "@typescript-eslint/tsconfig-utils@8.71.2"
  - "@typescript-eslint/type-utils@8.71.2"
  - "@typescript-eslint/types@8.71.2"
  - "@typescript-eslint/typescript-estree@8.71.2"
  - "@typescript-eslint/utils@8.71.2"
  - "@typescript-eslint/visitor-keys@8.71.2"
  - typescript-eslint@8.71.2
