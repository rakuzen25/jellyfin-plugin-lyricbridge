[project]
name = "jellyfin-lyricbridge-tooling"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
    "jellyfin-plugin-toolkit",
]

[tool.uv]
required-version = "==0.13.6"
python-preference = "only-managed"
exclude-newer = "1 day"

[tool.uv.sources]
jellyfin-plugin-toolkit = { url = "https://github.com/rakuzen25/jellyfin-plugin-toolkit/releases/download/v0.6.4/jellyfin_plugin_toolkit-0.6.4-py3-none-any.whl" }

[tool.ruff]
extend = ".build/jpt/configs/ruff.toml"
target-version = "py315"
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.mypy]
python_version = "3.15"
files = ["scripts", "tests"]
strict = true
mypy_path = "."

[dependency-groups]
dev = [
    "basedpyright>=1.40.2,<2",
    "mypy>=2.4,<3",
    "ruff>=0.17.1,<0.18",
]

[tool.basedpyright]
extends = ".build/jpt/configs/basedpyright.toml"
venvPath = "."
venv = ".venv"
pythonVersion = "3.15"
include = ["scripts", "tests"]
extraPaths = ["."]
