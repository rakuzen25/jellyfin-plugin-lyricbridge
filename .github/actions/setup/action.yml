name: LyricBridge pinned tooling
description: Frozen dependency restoration and verified official references
inputs:
  node:
    default: "false"
    description: Restore the pnpm workspace
  python:
    default: "false"
    description: Install Python check dependencies
  dotnet:
    default: "false"
    description: Install the pinned SDK and cache NuGet packages
  references:
    default: "false"
    description: Bootstrap or verify official Linux x64 references
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      if: inputs.node == 'true'
      with:
        run_install: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      if: inputs.node == 'true'
      with:
        node-version-file: .node-version
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      if: inputs.node == 'true'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      if: inputs.python == 'true'
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-check.txt
    - run: python -m pip install -r requirements-check.txt
      shell: bash
      if: inputs.python == 'true'
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      if: inputs.dotnet == 'true'
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: "**/packages.lock.json"
    - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4
      if: inputs.references == 'true'
      with:
        path: .build/jellyfin
        key: official-jellyfin-linux-amd64-${{ hashFiles('scripts/bootstrap-references.sh', 'scripts/reference-cache.py') }}
    - name: Verify official reference cache or bootstrap
      if: inputs.references == 'true'
      shell: bash
      run: |
        if ! python3 scripts/reference-cache.py verify; then
          rm -rf .build/jellyfin
          scripts/bootstrap-references.sh
          python3 scripts/reference-cache.py record
        fi
