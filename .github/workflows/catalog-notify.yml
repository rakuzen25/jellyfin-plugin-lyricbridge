name: Notify configured plugin catalog
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to retry
        type: string
        required: true
permissions:
  contents: read
jobs:
  notify:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/catalog-notify.yml@cfc551ea2eeee16984979a1b6e5c287f2b3a52d3 # v0.4.3
    with:
      catalog_repository: rakuzen25/jellyfin-plugin-manifest
      tag: ${{ github.event.release.tag_name || inputs.tag }}
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
