name: Build draft release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build or retry
        required: true
        type: string
      validated_run_id:
        description: Successful validation run whose immutable artifacts should be attached
        type: string
permissions:
  contents: write
  actions: read
  id-token: write
  attestations: write
jobs:
  release:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/release.yml@44027dfc0c531e7debb090cb17e4b015ea992608 # v1.0.0
    with:
      tag: ${{ inputs.tag }}
      validated_run_id: ${{ inputs.validated_run_id }}
