name: Build draft release artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        type: string
        default: ""
      validated_run_id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build or retry
        required: true
        type: string
      validated_run_id:
        description: Optional successful validation run ID to reuse tested artifacts and skip validation
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-artifacts-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.sha || inputs.tag }}
      release_tag: ${{ inputs.tag }}
      release_mode: true
  attach:
    needs: validate
    if: always() && (needs.validate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      VALIDATED_RUN_ID: ${{ inputs.validated_run_id || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          persist-credentials: false
      - name: Check out upload tooling from the workflow revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: scripts/release.py
          sparse-checkout-cone-mode: false
      - name: Use current uploader with the tagged release metadata
        run: cp .release-tools/scripts/release.py scripts/release.py
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify reused validation run
        if: inputs.validated_run_id != ''
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import subprocess
          run_id = os.environ["VALIDATED_RUN_ID"]
          if not run_id.isdecimal():
              raise SystemExit("Validation run ID must be numeric")
          repo = os.environ["REPOSITORY"]
          run = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/actions/runs/{run_id}"], text=True))
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if run["head_sha"] != commit:
              raise SystemExit("Validation run does not match the release commit")
          jobs = json.loads(subprocess.check_output(["gh", "api", "--paginate", "--slurp", f"repos/{repo}/actions/runs/{run_id}/jobs?per_page=100"], text=True))
          if not any(job["name"].split(" / ")[-1] == "validate" and job["conclusion"] == "success" for page in jobs for job in page["jobs"]):
              raise SystemExit("Run has no successful complete validation job")
          PYTHON
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lyricbridge-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id || github.run_id }}
      - name: Verify and attach the tested artifacts
        run: python3 scripts/release.py upload --repository "$REPOSITORY" --tag "$RELEASE_TAG"
      - name: Write handoff
        run: |
          echo "Draft artifacts verified. Review the green validation jobs, then publish the draft in GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "After publishing, update the shared Jellyfin catalog separately; see RELEASING.md." >> "$GITHUB_STEP_SUMMARY"
