name: Build draft release artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build or retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-artifacts-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.sha || inputs.tag }}
      release_tag: ${{ inputs.tag }}
      release_mode: true
  attach:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lyricbridge-candidate
          path: dist
      - name: Verify and attach the tested artifacts
        run: python3 scripts/release.py upload --repository "$REPOSITORY" --tag "$RELEASE_TAG"
      - name: Write handoff
        run: |
          echo "Draft artifacts verified. Review the green validation jobs, then publish the draft in GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "After publishing, update the shared Jellyfin catalog separately; see RELEASING.md." >> "$GITHUB_STEP_SUMMARY"
