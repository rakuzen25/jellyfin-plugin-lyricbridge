name: Build draft release artifacts
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      sha:
        type: string
        default: ""
      validated_run_id:
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build or retry
        required: true
        type: string
      validated_run_id:
        description: Optional successful validation run ID to reuse tested artifacts and skip validation
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-artifacts-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    if: inputs.validated_run_id == ''
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ inputs.sha || inputs.tag }}
      release_tag: ${{ inputs.tag }}
      release_mode: true
  attach:
    needs: validate
    if: always() && (needs.validate.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.validated_run_id != ''))
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      VALIDATED_RUN_ID: ${{ inputs.validated_run_id || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha || inputs.tag }}
          persist-credentials: false
      - name: Check out upload tooling from the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/release.py
            scripts/ci.py
            scripts/source_inventory.py
            .python-version
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .release-tools/.python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: lyricbridge-candidate
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.validated_run_id || github.run_id }}
      - name: Verify complete release receipt from the authenticated source run
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 .release-tools/scripts/ci.py verify --root . --run-id "${VALIDATED_RUN_ID:-${{ github.run_id }}}"
      - name: Attest the verified validation receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/validation.json
      - name: Verify and attach the tested artifacts
        run: |
          cp .release-tools/scripts/release.py scripts/release.py
          python3 scripts/release.py upload --repository "$REPOSITORY" --tag "$RELEASE_TAG"
      - name: Write handoff
        run: |
          echo "Draft artifacts verified. Review the green validation jobs, then publish the draft in GitHub Releases." >> "$GITHUB_STEP_SUMMARY"
          echo "Publishing triggers a verified catalog update; see docs/RELEASING.md." >> "$GITHUB_STEP_SUMMARY"
