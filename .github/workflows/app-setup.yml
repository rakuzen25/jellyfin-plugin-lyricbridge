name: Set up connected GitHub App
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/app-setup.yml
      - renovate.json
      - .github/jpt-automation.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/setup-automation.yml@5b40ac2f5d56620a30ddadeed23da8bd9df2bc72 # v0.5.1
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
      retry_closed: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
