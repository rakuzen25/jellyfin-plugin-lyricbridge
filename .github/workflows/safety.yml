name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@cfc551ea2eeee16984979a1b6e5c287f2b3a52d3 # v0.4.3
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
