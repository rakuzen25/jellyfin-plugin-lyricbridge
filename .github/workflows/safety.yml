name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@5afc0ada062c79016114bb4c88b6ee0d5fff3916 # v0.4.0
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
