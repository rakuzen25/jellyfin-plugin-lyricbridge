name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@c89abaf01d548fa735e166dfb22622e705d0c1b8 # v1.0.0
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
