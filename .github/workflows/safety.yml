name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@72d140f19049afcc3a3fc6a7b759867707200cf6 # v0.6.1
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
