name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: safety-${{ github.repository }}
  cancel-in-progress: false
jobs:
  safety:
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
