name: Changed-input full safety check
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  safety:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@b2e9575af98d8d08c4514b8de82a61b2f16c5b75 # v0.6.3
    with:
      ref: ${{ github.sha }}
      scheduled: ${{ github.event_name == 'schedule' }}
      full: ${{ github.event_name == 'workflow_dispatch' }}
