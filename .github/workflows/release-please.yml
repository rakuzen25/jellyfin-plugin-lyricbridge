name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  prepare:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/prepare-release.yml@eaeb6fe722bce351826d42d0aa4686df1ed59b5b # v0.4.1
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
