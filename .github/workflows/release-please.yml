name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  prepare:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/prepare-release.yml@5b40ac2f5d56620a30ddadeed23da8bd9df2bc72 # v0.5.1
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
