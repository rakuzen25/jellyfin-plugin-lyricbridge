name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write
  id-token: write
  attestations: write
jobs:
  prepare:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/prepare-release.yml@42ad9863b3a30c2244c5b20485c1233f765903cf # v0.1.0
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
