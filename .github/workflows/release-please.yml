name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  prepare:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/prepare-release.yml@cfc551ea2eeee16984979a1b6e5c287f2b3a52d3 # v0.4.3
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
