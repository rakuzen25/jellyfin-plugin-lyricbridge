name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
jobs:
  prepare:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/prepare-release.yml@5afc0ada062c79016114bb4c88b6ee0d5fff3916 # v0.4.0
    with:
      app_client_id: ${{ vars.PLUGIN_APP_CLIENT_ID }}
    secrets:
      PLUGIN_APP_PRIVATE_KEY: ${{ secrets.PLUGIN_APP_PRIVATE_KEY }}
