name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@42ad9863b3a30c2244c5b20485c1233f765903cf # v0.1.0
    with:
      full: ${{ inputs.full || false }}
