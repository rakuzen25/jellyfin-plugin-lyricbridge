name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@c89abaf01d548fa735e166dfb22622e705d0c1b8 # v1.0.0
    with:
      full: ${{ inputs.full || false }}
