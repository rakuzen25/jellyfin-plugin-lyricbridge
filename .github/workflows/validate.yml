name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@a08d44bb89bafe6635e7eb4c66e4c32b1bedc89b # v0.4.2
    with:
      full: ${{ inputs.full || false }}
