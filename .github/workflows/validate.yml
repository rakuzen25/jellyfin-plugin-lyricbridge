name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@44027dfc0c531e7debb090cb17e4b015ea992608 # v1.0.0
    with:
      full: ${{ inputs.full || false }}
