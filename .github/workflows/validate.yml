name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@eaeb6fe722bce351826d42d0aa4686df1ed59b5b # v0.4.1
    with:
      full: ${{ inputs.full || false }}
