name: Validate release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Execute all checks without evidence reuse
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
jobs:
  validation:
    uses: rakuzen25/jellyfin-plugin-toolkit/.github/workflows/validate.yml@cfc551ea2eeee16984979a1b6e5c287f2b3a52d3 # v0.4.3
    with:
      full: ${{ inputs.full || false }}
